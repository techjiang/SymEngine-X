<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SymEngine-X · 符号数学计算引擎</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #0b1020; color: #e6edf3; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
    header h1 { margin: 0; font-size: 30px; color: #7ee787; }
    header p { margin: 6px 0 24px; color: #9aa7b8; }
    .card { background: #151c30; border: 1px solid #263250; border-radius: 12px; padding: 20px; }
    input { width: 70%; padding: 10px 12px; border-radius: 6px; border: 1px solid #3a4a6b; background: #0d1426; color: #e6edf3; font-family: monospace; font-size: 15px; }
    button { padding: 10px 18px; margin-left: 8px; border: 0; border-radius: 6px; background: #2f81f7; color: white; cursor: pointer; font-size: 15px; }
    button:hover { background: #4b93f8; }
    .modes { margin: 12px 0; }
    .modes .active { background: #7ee787; color: #0b1020; font-weight: 600; }
    .card h2 { margin: 0 0 12px; font-size: 16px; color: #79c0ff; }
    pre { background: #0d1426; border-radius: 6px; padding: 14px; min-height: 24px; white-space: pre-wrap; }
    .steps { list-style: none; padding: 0; margin: 16px 0 0; }
    .steps li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #263250; }
    .steps span { color: #9aa7b8; font-size: 14px; }
    .steps code { color: #79c0ff; font-size: 14px; }
    ul { padding-left: 18px; color: #9aa7b8; }
    h3 { color: #9aa7b8; font-size: 14px; font-weight: 500; margin: 20px 0 8px; }
    li { margin: 4px 0; }
    footer { margin-top: 28px; color: #687386; font-size: 13px; }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
